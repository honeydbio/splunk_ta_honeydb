[HoneyDB - Update BadHosts Lookup]
search = `honeydb_index` sourcetype="honeydb_badhosts" | dedup remote_host | table remote_host, count, last_seen | outputlookup override_if_empty=false honeydb_badhosts_lookup
enableSched = 1
cron_schedule = */30 * * * *
dispatch.earliest_time = -60m
dispatch.latest_time = now
description = Refreshes the honeydb_badhosts_lookup KV store from the latest bad-hosts feed poll. override_if_empty prevents a missed poll from wiping the lookup.
